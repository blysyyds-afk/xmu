<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>厦大AI创新实践社甘特图</title>
<style>
body{font-family:"Microsoft YaHei",sans-serif;padding:30px;background:#f5f8fc}
h1{color:#1261a0}
.chart{background:white;padding:20px;margin:20px 0;border-radius:12px}
.row{display:flex;align-items:center;margin:12px 0}
.name{width:220px}
.bar{height:24px;background:#2589d8;border-radius:8px}
.stage{background:#ff9f43}
.plan{background:#5fca8d}
</style>
</head>
<body>
<h1>厦大AI创新实践社甘特图</h1>

<div class="chart">
<h2>一、成立筹备甘特图</h2>

<div class="row"><div class="name">社团章程制定</div><div class="bar" style="width:240px"></div></div>
<div class="row"><div class="name">成员组织</div><div class="bar" style="width:150px"></div></div>
<div class="row"><div class="name">审批准备</div><div class="bar" style="width:180px"></div></div>
</div>

<div class="chart">
<h2>二、年度活动规划甘特图</h2>
<div class="row"><div class="name">2026.10 招新交流</div><div class="bar stage" style="width:100px"></div></div>
<div class="row"><div class="name">2026.11 AI培训</div><div class="bar stage" style="width:100px"></div></div>
<div class="row"><div class="name">2026.12 项目实践</div><div class="bar stage" style="width:100px"></div></div>
<div class="row"><div class="name">2027.01-06 活动推进</div><div class="bar stage" style="width:420px"></div></div>
</div>

<div class="chart">

<div class="row"><div class="name">实践团队培养</div><div class="bar plan" style="width:350px"></div></div>
<div class="row"><div class="name">项目孵化机制</div><div class="bar plan" style="width:420px"></div></div>
<div class="row"><div class="name">竞赛创新实践</div><div class="bar plan" style="width:420px"></div></div>
</div>

</body>
</html>
